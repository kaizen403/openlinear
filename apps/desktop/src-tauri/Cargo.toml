[package]
name = "openlinear-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "openlinear_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "6.0"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rfd = "0.15"
# Both already resolve in Cargo.lock as transitive deps of tauri/tauri-plugin-*
# (getrandom/uuid/libc), so promoting them to direct deps here doesn't add new
# supply-chain surface — it just lets sidecar.rs use them directly.
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
