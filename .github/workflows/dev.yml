name: Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-${{ github.ref_name }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @openlinear/db db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Migration safety review
        run: |
          FILES=$(git diff --name-only origin/${{ github.event.repository.default_branch }}...HEAD -- 'packages/db/prisma/migrations/**' || true)
          if [ -z "$FILES" ]; then
            echo "No migration changes."
            exit 0
          fi
          FAIL=0
          for f in $FILES; do
            [ -f "$f" ] || continue
            if grep -q 'migration-safety: allow' "$f"; then
              echo "skip (opt-in): $f"
              continue
            fi
            if grep -iEq '^[[:space:]]*(DROP[[:space:]]+(TABLE|COLUMN)|ALTER[[:space:]]+TABLE[^;]*DROP[[:space:]]+COLUMN|TRUNCATE)' "$f"; then
              echo "::error file=$f::destructive DDL without '-- migration-safety: allow'"; FAIL=1
            fi
            if grep -iE '^[[:space:]]*CREATE[[:space:]]+(UNIQUE[[:space:]]+)?INDEX' "$f" | grep -ivq 'CONCURRENTLY'; then
              echo "::error file=$f::CREATE INDEX without CONCURRENTLY"; FAIL=1
            fi
          done
          exit $FAIL

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openlinear
          POSTGRES_PASSWORD: openlinear
          POSTGRES_DB: openlinear_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://openlinear:openlinear@localhost:5432/openlinear_test
      TEST_DATABASE_URL: postgresql://openlinear:openlinear@localhost:5432/openlinear_test
      OPENLINEAR_ALLOW_NONLOCAL_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @openlinear/db db:generate

      - name: Push schema to test database
        run: pnpm --filter @openlinear/db exec prisma migrate deploy

      - name: Run tests
        run: pnpm test
        timeout-minutes: 5

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @openlinear/db db:generate

      - name: Build all packages
        run: pnpm build --filter '!@openlinear/desktop' --filter '!intro-video'
