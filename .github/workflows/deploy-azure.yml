name: Deploy API to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  AZURE_CONTAINER_APP_NAME: openlinear-api
  AZURE_RESOURCE_GROUP: rg-openlinear-prod
  AZURE_REGISTRY: openlinearcr.azurecr.io
  AZURE_REGISTRY_NAME: openlinearcr
  IMAGE_NAME: openlinear-api

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openlinear
          POSTGRES_PASSWORD: openlinear
          POSTGRES_DB: openlinear_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://openlinear:openlinear@localhost:5432/openlinear_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @openlinear/db db:generate

      # `db:push` reconciles the schema without producing or validating a
      # migration, so CI proved nothing about the migrations that actually run
      # in production. Apply the real migration history instead, then assert the
      # schema and the migrations have not drifted apart.
      - name: Apply migrations to test database
        run: pnpm --filter @openlinear/db exec prisma migrate deploy

      - name: Check for schema/migration drift
        run: |
          pnpm --filter @openlinear/db exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code && echo "No drift." || {
              echo "::error::schema.prisma has changes with no corresponding migration. Run 'prisma migrate dev' and commit the result."
              exit 1
            }

      - name: Migration safety review
        run: |
          # Destructive DDL and non-concurrent index builds take long locks and
          # can drop data during a rolling deploy. Require an explicit opt-in
          # comment so the decision is visible in review.
          FILES=$(git diff --name-only origin/${{ github.event.repository.default_branch }}...HEAD -- 'packages/db/prisma/migrations/**' || true)
          if [ -z "$FILES" ]; then
            echo "No migration changes."
            exit 0
          fi
          FAIL=0
          for f in $FILES; do
            [ -f "$f" ] || continue
            if grep -q 'migration-safety: allow' "$f"; then
              echo "skip (opt-in): $f"
              continue
            fi
            if grep -iEq '^[[:space:]]*(DROP[[:space:]]+(TABLE|COLUMN)|ALTER[[:space:]]+TABLE[^;]*DROP[[:space:]]+COLUMN|TRUNCATE)' "$f"; then
              echo "::error file=$f::destructive DDL without '-- migration-safety: allow'"; FAIL=1
            fi
            # POSIX ERE has no lookahead: flag any CREATE INDEX line that does
            # not itself say CONCURRENTLY.
            if grep -iE '^[[:space:]]*CREATE[[:space:]]+(UNIQUE[[:space:]]+)?INDEX' "$f" | grep -ivq 'CONCURRENTLY'; then
              echo "::error file=$f::CREATE INDEX without CONCURRENTLY"; FAIL=1
            fi
          done
          exit $FAIL

      - name: Typecheck
        run: pnpm --filter @openlinear/api typecheck

      - name: Build API
        run: pnpm --filter @openlinear/api build

      - name: Build Web
        run: pnpm --filter @openlinear/desktop-ui build
        env:
          NEXT_PUBLIC_API_URL: https://openlinear.tech

      - name: Build Landing
        run: pnpm --filter @openlinear/landing build

      - name: Test
        run: pnpm --filter @openlinear/api test

  build-and-push:
    name: Build and Push Docker Image
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_REGISTRY }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.AZURE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.AZURE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-azure:
    name: Deploy to Azure Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App
        run: |
          az containerapp update \
            --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.AZURE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --min-replicas 1 \
            --max-replicas 1
          # Clamped to a single replica on purpose.
          #
          # SSE fan-out, rate-limit counters, the idempotency cache and the
          # GitHub response caches are all per-process in-memory maps. At three
          # replicas roughly two thirds of real-time events never reach a given
          # client and `Idempotency-Key` stops being idempotent. Raise this only
          # after the transactional outbox + Redis pub/sub land (Phase 1).

      - name: Wait for revision to be ready
        run: |
          echo "Waiting for Container App revision to be ready..."
          for i in $(seq 1 30); do
            STATUS=$(az containerapp show \
              --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "properties.runningStatus" -o tsv)
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "Running" ]; then
              echo "Container App is running!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Timeout waiting for Container App"
              exit 1
            fi
            sleep 10
          done

      - name: Verify deployment
        run: |
          echo "Testing API health endpoint..."
          for i in $(seq 1 20); do
            HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
              https://api.openlinear.tech/health || echo "000")
            echo "Attempt $i: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✓ Deployment verified — API is healthy"
              exit 0
            fi
            if [ "$i" -eq 20 ]; then
              echo "✗ Health check failed after 20 attempts"
              exit 1
            fi
            sleep 5
          done

      - name: Run diagnostics on failure
        if: failure()
        run: |
          echo "=== Container App Status ==="
          az containerapp show \
            --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties"
          
          echo ""
          echo "=== Container Logs ==="
          az containerapp logs show \
            --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --tail 50


