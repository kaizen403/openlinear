services:
  openlinear:
    build:
      context: .
      dockerfile: Dockerfile
    image: openlinear:preview
    container_name: openlinear
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      SIDECAR_BIND_HOST: 0.0.0.0
    volumes:
      - openlinear-pgdata:/var/lib/postgresql/data
      - openlinear-repos:/var/lib/openlinear/repos
      - openlinear-logs:/var/log/openlinear

volumes:
  openlinear-pgdata:
    name: openlinear-pgdata
  openlinear-repos:
    name: openlinear-repos
  openlinear-logs:
    name: openlinear-logs
